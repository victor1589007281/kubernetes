apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "node-io-manager.fullname" . }}
  labels:
    {{- include "node-io-manager.labels" . | nindent 4 }}
rules:
  # Pod 相关权限
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "patch", "update"]
  
  # Node 相关权限
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["get", "patch", "update"]
  
  # PV/PVC 相关权限
  - apiGroups: [""]
    resources: ["persistentvolumes", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  
  # ConfigMap 相关权限
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  
  # Event 相关权限
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  
  # Namespace 相关权限
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  
  # 自定义资源权限 (业务优先级配置)
  - apiGroups: ["node-io-manager.io"]
    resources: ["businesspriorities"]
    verbs: ["get", "list", "watch"]
  
  # 调度相关权限
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
